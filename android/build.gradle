// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "29.0.2"
        minSdkVersion = 23
        compileSdkVersion = 33
        targetSdkVersion = 35
        // Read these values from a pair of files that is also read by iOS.
        // Edit VersionString.txt/BuildNumber.txt to update versioning. Do not embed version numbers in this Gradle file.
        versionCode = 99
        versionName = '4.2.3'
        kotlinVersion = "1.6.21"
    }
    repositories {
        google()
        maven { url 'https://repo1.maven.org/maven2/' }
    }
    dependencies {
        classpath('com.android.tools.build:gradle:4.0.1')
        // classpath('com.android.tools.build:gradle:4.0.1')
        classpath 'com.google.gms:google-services:4.3.10'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        maven { url uri("${rootDir}/local-plugin-repo") }
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }

        maven {
          // expo-camera bundles a custom com.google.android:cameraview
          url "$rootDir/../node_modules/expo-camera/android/maven"
        }

        exclusiveContent {
            filter {
                includeGroup "com.facebook.react"
            }
            forRepository {
                maven {
                    url "$rootDir/../node_modules/react-native/android"
                }
            }
        }

        google()
        maven { url 'https://repo1.maven.org/maven2/' }
        maven { url 'https://www.jitpack.io' }
    }
}

// Prefer repo1.maven.org (VPN DNS often breaks repo.maven.apache.org)
subprojects { subproject ->
    subproject.buildscript {
        configurations.classpath {
            resolutionStrategy {
                force 'com.android.tools.build:gradle:4.0.1'
            }
        }
    }
    subproject.beforeEvaluate {
        subproject.buildscript {
            repositories {
                maven { url uri("${rootDir}/local-plugin-repo") }
                google()
                maven { url 'https://repo1.maven.org/maven2/' }
            }
        }
        subproject.repositories {
            maven { url uri("${rootDir}/local-plugin-repo") }
            google()
            maven { url 'https://repo1.maven.org/maven2/' }
            maven { url 'https://www.jitpack.io' }
        }
        subproject.configurations.all {
            resolutionStrategy {
                force 'androidx.activity:activity:1.6.1'
                force 'androidx.annotation:annotation-experimental:1.3.0'
                force 'androidx.core:core:1.9.0'
                force 'androidx.annotation:annotation:1.1.0'
                force 'androidx.browser:browser:1.5.0'
                force 'org.jetbrains.kotlin:kotlin-stdlib:1.6.21'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.6.21'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.6.21'
            }
        }
    }
    subproject.afterEvaluate {
        if (subproject.plugins.hasPlugin('com.android.library') || subproject.plugins.hasPlugin('com.android.application')) {
            subproject.dependencies {
                implementation 'androidx.annotation:annotation:1.1.0'
            }
        }
    }
}
